[project]
name = "job-outreach"
version = "0.1.0"
description = "Local, approval-driven job discovery and Gmail outreach"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5",
  "streamlit>=1.42,<2", "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2", "cryptography>=44,<49",
  "apscheduler>=3.11,<4", "email-validator>=2.2,<3", "pgvector>=0.3,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
